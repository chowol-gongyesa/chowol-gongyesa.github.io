site:
  name: 초월공예
  # 정식 주소: 초월공예.com (컴퓨터용 글자 xn--ob0bn98bprap2r.com) — 2026-11-21 가비아에서 10년 구입.
  # GitHub 저장소 Settings → Pages의 Custom domain과 같아야 함. 옛 샘플 주소(chowol-gongyesa.github.io)는 이 주소로 넘어감
  # 하위 폴더 주소(예: .../chowol-homepage/)에 올려야 하면 base에 그 폴더 이름을 — 사진·영상 경로는 base를 따라가게 만들어 둠
  site: 'https://xn--ob0bn98bprap2r.com'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: null # TODO: 구글 서치 콘솔 등록 때 새로 받기

# Default SEO metadata
metadata:
  title:
    default: 초월공예 — 자동 로구로 전문
    template: '%s — 초월공예'
  description: '경기도 광주시 초월읍의 로구로 공방 초월공예. 자동 로구로로 가구 다리·난간 동자·봉·원목 공을 같은 모양으로 대량 생산하고, 개인 주문도 받습니다. 상담전화 010-8548-7264.'
  # 정식 공개(2026-11-21): 검색에 나오게 허용. 다시 숨기려면 둘 다 false로
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 초월공예
    images:
      - url: '~/assets/images/og/og-ko.jpg'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: null
    site: null
    cardType: summary_large_image

i18n:
  language: ko
  textDirection: ltr

apps:
  blog:
    # 소식(블로그)은 꺼 둠. 글을 쓰게 되면 true로 바꾸고 src/data/post/에 글을 넣으세요.
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
