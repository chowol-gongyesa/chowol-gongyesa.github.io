site:
  name: 초월공예사
  site: 'https://example.com' # TODO: 공개 주소가 정해지면 바꾸기
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: null # TODO: 구글 서치 콘솔 등록 때 새로 받기

# Default SEO metadata
metadata:
  title:
    default: 초월공예사 — 자동 로구로 전문
    template: '%s — 초월공예사'
  description: '경기도 광주시 초월읍 초월공예사. 40년 경력의 로구로 공방으로, 자동 로구로로 가구 다리·난간 동자·봉·원목 공을 같은 모양으로 대량 생산합니다. 개인 주문도 받습니다. 상담전화 010-8548-7264.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 초월공예사
    images:
      - url: '~/assets/images/og/og-ko.jpg'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: null
    site: null
    cardType: summary_large_image

i18n:
  language: ko
  textDirection: ltr

apps:
  blog:
    # 소식(블로그)은 꺼 둠. 글을 쓰게 되면 true로 바꾸고 src/data/post/에 글을 넣으세요.
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/news/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'news'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
