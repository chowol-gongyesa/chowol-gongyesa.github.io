name: Deploy to GitHub Pages

# main에 올리면(push) 사이트를 다시 만들어 GitHub Pages에 올립니다.
# 지금 주소(샘플, 검색에 안 나옴): https://chowol-gongyesa.github.io/ — 주소 설정은 src/config.yaml (site, base)
# 저장소 Settings → Pages → Source가 'GitHub Actions'여야 합니다. Actions 탭에서 'Run workflow'로 손으로도 돌릴 수 있음
on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매년 1월 1일 0시 10분(한국 시간 = 12월 31일 15:10 UTC)에 다시 만들어 경력 연수(src/data/years.ts)·저작권 연도를 올림.
  # 빌드는 아래 TZ로 한국 시간 기준이라 그 시각엔 새해로 계산됨 (예전 오류: UTC로는 아직 12월 31일이라 안 올라갔음)
  # 주의: 공개 저장소는 60일 동안 아무 변경이 없으면 GitHub이 이 일정을 저절로 끔 → 해가 바뀌면 Actions 탭에서 확인하거나 'Run workflow'
  schedule:
    - cron: '10 15 31 12 *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul # 연도 계산(years.ts, 바닥글 ©)을 한국 시간으로
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
