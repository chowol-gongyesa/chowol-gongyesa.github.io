name: Deploy to GitHub Pages

# main에 올리면(push) 사이트를 다시 만들어 GitHub Pages에 올립니다.
# 지금 주소(샘플, 검색에 안 나옴): https://bobby-choi7264.github.io/chowol-homepage/ — 주소 설정은 src/config.yaml (site, base)
# 저장소 Settings → Pages → Source가 'GitHub Actions'여야 합니다. Actions 탭에서 'Run workflow'로 손으로도 돌릴 수 있음
on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매년 1월 1일 0시(한국 시간)에 다시 만들어 경력 연수(src/data/years.ts)를 올림
  schedule:
    - cron: '0 15 31 12 *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
