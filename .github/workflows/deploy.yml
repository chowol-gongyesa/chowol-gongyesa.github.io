name: Deploy to GitHub Pages

# ⚠️ 지금은 자동 배포를 꺼 둠 (2026-11-21, 사용자 결정): 주소(도메인)를 정하고 사장님 문구 확인이 끝나면 공개합니다.
#    공개할 때: ① src/config.yaml 의 site를 실제 주소로 ② 저장소 Settings → Pages → Source를 'GitHub Actions'로
#              ③ 아래 push·schedule 줄의 주석(#)을 풀기. 그 전에는 Actions 탭에서 'Run workflow'로만 손으로 돌릴 수 있음
on:
  # push:
  #   branches: [main]
  workflow_dispatch:
  # 매년 1월 1일 0시(한국 시간)에 다시 만들어 경력 연수(src/data/years.ts)를 올림
  # schedule:
  #   - cron: '0 15 31 12 *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
